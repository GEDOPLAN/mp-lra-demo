# Port
quarkus.http.port=8180

# Logging
# quarkus.log.console.darken=1
quarkus.log.console.format=%s%e%n
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."io.quarkus.arc".level=ERROR
quarkus.log.category."io.quarkus.deployment".level=ERROR
quarkus.log.category."de.gedoplan.showcase".level=DEBUG

quarkus.banner.path=banner.txt

# Persistence
quarkus.hibernate-orm.schema-management.strategy=update

# LRA Coordinator
quarkus.lra.coordinator-url=http://localhost:8080/lra-coordinator
# quarkus.lra.devservices.log-warning=false
